apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/Seom88
  services.yaml: |
    - Platform Services:
        - Argocd:
            href: https://my-cluster.lonk-mirfak.ts.net/argocd
            description: Homepage is awesome
        - Grafana:
            href: https://my-cluster.lonk-mirfak.ts.net/grafana
            description: Homepage is awesome
        - Prometheus:
            href: https://my-cluster.lonk-mirfak.ts.net/prometheus
            description: Homepage is awesome
        - Hubble:
            href: https://my-cluster.lonk-mirfak.ts.net/hubble
            description: Homepage is awesome
        - Longhorn:
            href: https://my-cluster.lonk-mirfak.ts.net/longhorn
            description: Homepage is awesome
        - SeaweedFS Admin:
            href: https://my-cluster.lonk-mirfak.ts.net/seaweedfs-admin
            description: Homepage is awesome
        - My Secrets:
            href: https://vault-my-cluster.lonk-mirfak.ts.net
            description: Homepage is awesome

    # - My Second Group:
    #     - My Second Service:
    #         href: https://my-cluster.lonk-mirfak.ts.net/grafana
    #         description: Homepage is the best

    # - My Third Group:
    #     - My Third Service:
    #         href: http://localhost/
    #         description: Homepage is 😎
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
