# ---------------------------------------------------------------------------
# ADR (summary of decisions made before writing this):
#
#  1. Shamir + keys in a k8s Secret is kept (no migration to Transit/KMS).
#     Intentional decision: avoid depending on a third-party KMS.
#  2. Status and unseal now go over direct HTTP (curl) to /v1/sys/seal-status
#     and /v1/sys/unseal — both are UNAUTHENTICATED Vault endpoints. kubectl
#     is only used for discovery (pods, statefulset, secrets, logs). This
#     replaces "kubectl exec ... vault status/unseal" from the old script.
#  3. The unseal threshold ("t") is read dynamically from /sys/seal-status
#     on every cycle (currently 3 of 5) — no more hardcoded ">= 2".
#  4. No more manual "vault operator raft join/remove-peer":
#       - Automatic join is already handled by "retry_join" in the "raft"
#         storage block of the Vault values.yaml (all replicas are already
#         listed there).
#       - Dead-peer cleanup is delegated to Vault's own Autopilot
#         (cleanup_dead_servers + dynamic min_quorum = replica count),
#         configured ONCE, outside this watcher (see note at the end of
#         this file) because it requires a token with "sudo" capability
#         that this minimally-scoped Deployment should not hold (least
#         privilege). Only applies when replicas >= 3 (in dev, with 1
#         replica, there's no concept of a "dead peer" to clean up).
#  5. Secondary causes (full PVC, expired certificate, Vault down at the
#     process level) are diagnosed via "kubectl logs" and logged in a
#     distinguishable way, WITHOUT attempting any automatic remediation.
#  6. Base image stays the same: bitnami/kubectl:latest (confirmed to ship
#     curl 8.21.0; no wget, no python3).
#  7. Security (see the security-basics skill): unseal keys are never
#     logged; they're read from the Secret and used only in memory for the
#     POST body; nothing is written to disk (the "tmp" volume isn't needed
#     for this anymore, but is kept in case curl needs an internal temp
#     file).
# ---------------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-autounseal-script
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-autounseal
    app.kubernetes.io/component: operations
data:
  unseal.sh: |
    #!/bin/sh
    set -e

    NAMESPACE="${VAULT_NAMESPACE:-vault}"
    CA_FILE="${VAULT_CACERT:-/vault/userconfig/vault-tls/ca.crt}"
    KUBECTL="kubectl"
    KUBE_TIMEOUT="${KUBE_TIMEOUT:-20}"
    CURL_TIMEOUT="${VAULT_CURL_TIMEOUT:-10}"
    OVERALL_FAILED=0

    # ---- lightweight readiness guard ----
    # Before making any HTTP call, if the StatefulSet already reports all
    # its replicas Ready, there's nothing to do this cycle.
    _DESIRED=$(timeout $KUBE_TIMEOUT $KUBECTL get statefulset -n "$NAMESPACE" \
      -l app.kubernetes.io/name=vault \
      -o jsonpath='{.items[0].spec.replicas}' 2>/dev/null || echo "0")

    _READY_RAW=$(timeout $KUBE_TIMEOUT $KUBECTL get pods -n "$NAMESPACE" \
      -l app.kubernetes.io/name=vault,component=server \
      -o jsonpath='{range .items[*]}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}' 2>/dev/null || true)
    _READY=$(printf '%s\n' "$_READY_RAW" | grep -c "^True$" || true)
    _READY=${_READY:-0}

    if [ "$_DESIRED" -gt 0 ] && [ "$_READY" -ge "$_DESIRED" ]; then
      echo "[autounseal] $_READY/$_DESIRED pods Ready - nothing to do."
      exit 0
    fi

    echo "[autounseal] $_READY/$_DESIRED Ready - checking namespace: $NAMESPACE"

    # ---- helpers ----
    # Extracts a field from a JSON blob. Uses jq if available, falls back
    # to grep otherwise. Designed to ALWAYS return 0 (never aborts the
    # script over a missing field): an absent field is information, not
    # an error.
    parse_field() {
      _json="$1"
      _field="$2"
      if command -v jq >/dev/null 2>&1; then
        echo "$_json" | jq -r --arg f "$_field" 'if .[$f] == null then empty else .[$f] end' 2>/dev/null | tr -d '\n'
        return 0
      fi
      _val=$(echo "$_json" | grep -o "\"$_field\"[[:space:]]*:[[:space:]]*[^,}]*" 2>/dev/null | head -1 | grep -o 'true\|false' 2>/dev/null || true)
      if [ -n "$_val" ]; then
        echo "$_val"
      else
        echo "$_json" | grep -o "\"$_field\"[[:space:]]*:[[:space:]]*[0-9][0-9]*" 2>/dev/null | head -1 | grep -o '[0-9][0-9]*$' 2>/dev/null || true
      fi
    }

    # GET/POST against Vault's HTTP API. /sys/seal-status and /sys/unseal
    # are unauthenticated endpoints (see developer.hashicorp.com/vault/api-docs).
    # Unlike parse_field, here we DO want curl's exit code to propagate,
    # so we can tell "not responding" apart from "responding but sealed".
    vault_get() {
      timeout "$CURL_TIMEOUT" curl -sS --cacert "$CA_FILE" --max-time "$CURL_TIMEOUT" "$1" 2>/dev/null
    }

    vault_post() {
      timeout "$CURL_TIMEOUT" curl -sS --cacert "$CA_FILE" --max-time "$CURL_TIMEOUT" \
        -X POST -H 'Content-Type: application/json' --data "$2" "$1" 2>/dev/null
    }

    # Best-effort diagnostics when a pod doesn't respond over HTTP. This
    # only reports (logs), it never tries to fix anything.
    diagnose_pod() {
      _pod="$1"
      _phase=$(timeout $KUBE_TIMEOUT $KUBECTL get pod "$_pod" -n "$NAMESPACE" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
      _waiting=$(timeout $KUBE_TIMEOUT $KUBECTL get pod "$_pod" -n "$NAMESPACE" -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || true)

      if [ "$_phase" != "Running" ]; then
        echo "[diagnosis] $_pod: phase=$_phase waiting=${_waiting:-n/a} - likely a scheduling/image/PVC issue, not a seal issue."
        return 0
      fi

      _logs=$(timeout $KUBE_TIMEOUT $KUBECTL logs "$_pod" -n "$NAMESPACE" --tail=30 --since=120s 2>/dev/null || true)
      if echo "$_logs" | grep -qi "no space left on device"; then
        echo "[diagnosis] $_pod: disk full (PVC) - check dataStorage/auditStorage."
      elif echo "$_logs" | grep -qi "certificate has expired\|x509"; then
        echo "[diagnosis] $_pod: TLS certificate issue - check the vault-tls secret / cert-manager."
      elif echo "$_logs" | grep -qi "connection refused"; then
        echo "[diagnosis] $_pod: Vault process not responding on 8200 (starting up or crashed)."
      elif echo "$_logs" | grep -qi "raft.*error\|failed to.*leader"; then
        echo "[diagnosis] $_pod: possible raft leader-election issue."
      else
        echo "[diagnosis] $_pod: cause not automatically recognized - check 'kubectl logs $_pod -n $NAMESPACE'."
      fi
    }

    # ---- discover running pods ----
    PODS=$(timeout $KUBE_TIMEOUT $KUBECTL get pods -n "$NAMESPACE" \
      -l app.kubernetes.io/name=vault,component=server \
      --field-selector=status.phase=Running \
      -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)

    if [ -z "$PODS" ]; then
      echo "[autounseal] ERROR: no Vault pods in Running phase yet."
      exit 1
    fi

    FIRST_POD=$(echo "$PODS" | awk '{print $1}')
    RELEASE_NAME=$(timeout $KUBE_TIMEOUT $KUBECTL get pod "$FIRST_POD" -n "$NAMESPACE" \
      -o jsonpath='{.metadata.labels.app\.kubernetes\.io/instance}' 2>/dev/null || true)

    if [ -z "$RELEASE_NAME" ]; then
      echo "[autounseal] ERROR: could not determine the Helm release name from pod labels."
      exit 1
    fi

    SECRET_NAME="${RELEASE_NAME}-unseal-keys"
    INTERNAL_SVC="${RELEASE_NAME}-internal"

    # If the keys secret doesn't exist, Vault likely hasn't been
    # initialized yet (first boot). This is not a failure: skip this
    # cycle's read and retry next time.
    if ! timeout $KUBE_TIMEOUT $KUBECTL get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
      echo "[autounseal] Secret '$SECRET_NAME' does not exist yet - skipping this cycle (not an error)."
      exit 0
    fi

    # ---- dynamic key names (supports any n, not just 3/5) ----
    SECRET_JSON=$(timeout $KUBE_TIMEOUT $KUBECTL get secret "$SECRET_NAME" -n "$NAMESPACE" -o json 2>/dev/null || echo "")
    if [ -z "$SECRET_JSON" ]; then
      echo "[autounseal] ERROR: failed to read secret $SECRET_NAME."
      exit 1
    fi

    if command -v jq >/dev/null 2>&1; then
      KEY_NAMES=$(echo "$SECRET_JSON" | jq -r '.data | keys[]' 2>/dev/null | grep -E '^key[0-9]+$' | sort -V || true)
    else
      KEY_NAMES=$(echo "$SECRET_JSON" | grep -o '"key[0-9][0-9]*"[[:space:]]*:' 2>/dev/null | sed 's/"//g; s/://g' | sort -V || true)
    fi
    KEY_NAMES=$(echo "$KEY_NAMES" | tr '\n' ' ')

    if [ -z "$(echo "$KEY_NAMES" | tr -d '[:space:]')" ]; then
      echo "[autounseal] ERROR: no keys found in $SECRET_NAME (expected key1..keyN)."
      exit 1
    fi

    # ---- main loop, per pod ----
    for POD in $PODS; do
      URL="https://${POD}.${INTERNAL_SVC}.${NAMESPACE}.svc.cluster.local:8200"

      STATUS=$(vault_get "$URL/v1/sys/seal-status" || true)
      if [ -z "$STATUS" ]; then
        echo "[autounseal] $POD: no HTTP response from $URL/v1/sys/seal-status."
        diagnose_pod "$POD"
        OVERALL_FAILED=1
        continue
      fi

      INITIALIZED=$(parse_field "$STATUS" "initialized")
      SEALED=$(parse_field "$STATUS" "sealed")
      THRESHOLD=$(parse_field "$STATUS" "t")

      echo "[autounseal] $POD: initialized=$INITIALIZED sealed=$SEALED threshold=${THRESHOLD:-unknown}"

      # Case: not initialized. Raft join is already attempted by Vault
      # itself via "retry_join" (see the "raft" storage block in
      # values.yaml) — this watcher does NOT run "vault operator raft
      # join" by hand.
      if [ "$INITIALIZED" != "true" ]; then
        echo "[autounseal] $POD: not initialized - waiting on automatic join (retry_join) or the initial 'vault operator init'."
        continue
      fi

      if [ "$SEALED" != "true" ]; then
        echo "[autounseal] $POD: already unsealed."
        continue
      fi

      if [ -z "$THRESHOLD" ] || ! [ "$THRESHOLD" -gt 0 ] 2>/dev/null; then
        echo "[unseal] $POD: WARNING - could not read the real threshold from seal-status, falling back to 3."
        THRESHOLD=3
      fi

      echo "[unseal] $POD: sealed, threshold=$THRESHOLD - sending keys (value is never logged)..."
      _sent=0
      for K in $KEY_NAMES; do
        [ -z "$K" ] && continue
        [ "$_sent" -ge "$THRESHOLD" ] && break

        VAL=$(timeout $KUBE_TIMEOUT $KUBECTL get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath="{.data.$K}" 2>/dev/null | base64 -d 2>/dev/null || echo "")
        if [ -z "$VAL" ]; then
          echo "[unseal] $POD: key $K empty or failed to decode, skipping."
          continue
        fi

        RESP=$(vault_post "$URL/v1/sys/unseal" "{\"key\":\"$VAL\"}" || true)
        unset VAL

        if [ -z "$RESP" ]; then
          echo "[unseal] $POD: no response while sending $K, will retry next cycle."
          continue
        fi

        _sent=$((_sent + 1))
        NEW_SEALED=$(parse_field "$RESP" "sealed")
        if [ "$NEW_SEALED" = "false" ]; then
          echo "[unseal] $POD: unsealed successfully with $_sent key(s)."
          break
        fi
      done

      FINAL=$(vault_get "$URL/v1/sys/seal-status" || true)
      FINAL_SEALED=$(parse_field "$FINAL" "sealed")
      if [ "$FINAL_SEALED" = "true" ]; then
        echo "[unseal] $POD: ERROR - still sealed after sending $_sent key(s) out of threshold $THRESHOLD."
        OVERALL_FAILED=1
      fi
    done

    if [ "$OVERALL_FAILED" -ne 0 ]; then
      echo "[autounseal] Cycle complete - some pods are still pending."
      exit 1
    fi

    echo "[autounseal] Cycle complete - all reachable pods are unsealed."
    exit 0
